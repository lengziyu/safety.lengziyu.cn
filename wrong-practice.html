<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>错题练习</title>
  <style>
    :root {
      --bg1: #f4f7fb;
      --bg2: #eef8f3;
      --card: #ffffff;
      --line: #dce5ef;
      --text: #1f2937;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-soft: #dbf3ef;
      --warn: #b45309;
      --ok: #166534;
      --bad: #b91c1c;
      --shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: radial-gradient(circle at 15% 0%, #fff7ed 0%, transparent 35%), linear-gradient(145deg, var(--bg1), var(--bg2));
    }

    .wrap {
      width: min(980px, calc(100% - 20px));
      margin: 14px auto 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .top {
      position: sticky;
      top: 8px;
      z-index: 30;
      backdrop-filter: blur(6px);
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .action-link,
    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .16s ease;
    }

    .action-link:hover,
    button:hover { transform: translateY(-1px); }
    .action-link:focus-visible,
    button:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 2px; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--primary-soft); color: var(--primary); border-color: #c3e9e2; }
    .btn-plain { background: #fff; border-color: var(--line); color: var(--text); }

    .main {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px;
      box-shadow: var(--shadow);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 8px;
    }

    .tag {
      padding: 2px 10px;
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid #d6e4f5;
      background: #eef5ff;
      color: #1e3a8a;
    }

    .q {
      margin: 0 0 10px;
      line-height: 1.58;
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .opts {
      display: grid;
      gap: 8px;
    }

    .opt {
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      column-gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 9px 10px;
    }

    .opt input {
      justify-self: center;
      margin-top: 0;
      accent-color: var(--primary);
      transform: scale(1.08);
    }

    .opt > span { line-height: 1.5; }

    .opt.correct { background: #edfdf3; border-color: #b7e4c6; }
    .opt.wrong { background: #fff1f2; border-color: #fecdd3; }

    .feedback {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
    }

    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }

    .answer,
    .analysis {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .show-answer .answer,
    .show-answer .analysis { display: block; }

    .tip {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .confirm-wrap {
      margin-top: 10px;
    }

    .confirm-wrap button {
      width: 100%;
      background: var(--primary);
      color: #fff;
    }

    .actions {
      display: grid;
      gap: 8px;
    }

    .actions button { width: 100%; }

    .status {
      color: var(--warn);
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
      padding: 2px 2px 0;
    }

    .live-stats {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      padding: 2px 2px 0;
    }

    .empty {
      border: 1px dashed #bdd2ea;
      background: #f8fbff;
      border-radius: 12px;
      padding: 18px;
      color: #34506b;
      text-align: center;
      line-height: 1.55;
    }

    .empty-actions {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }

    @media (min-width: 760px) {
      .wrap { margin-top: 20px; }
      h1 { font-size: 24px; }
      .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel top">
      <div class="head">
        <h1>错题练习</h1>
        <a href="index.html" class="action-link btn-plain">返回首页</a>
      </div>
    </section>

    <section class="main">
      <div id="liveStats" class="live-stats"></div>
      <article id="questionCard" class="card"></article>
      <div class="actions">
        <button id="prevBtn" class="btn-plain" type="button">上一题</button>
        <button id="nextBtn" class="btn-plain" type="button">下一题</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const WRONG_BOOK_KEY = 'c3_wrong_book_v1';
    const TYPE_LABEL = { single: '单选', multiple: '多选', judge: '判断', case: '案例' };
    const AUTO_REVIEW_STAY_MS = 1200;

    const app = {
      questions: [],
      currentIndex: 0,
      selections: {},
      locked: {},
      timer: null
    };

    const el = {
      liveStats: document.getElementById('liveStats'),
      questionCard: document.getElementById('questionCard'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      status: document.getElementById('status')
    };

    function loadWrongBook() {
      try {
        const raw = localStorage.getItem(WRONG_BOOK_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveWrongBook(items) {
      localStorage.setItem(WRONG_BOOK_KEY, JSON.stringify(items));
    }

    function groupWrongQuestions(items) {
      const map = new Map();
      items.forEach(i => {
        const id = String(i.id || '').trim();
        if (!id) return;
        if (!map.has(id)) {
          map.set(id, {
            ...i,
            id,
            wrongCount: Number(i.wrongCount || 1),
            lastWrongAt: Number(i.lastWrongAt || 0)
          });
          return;
        }
        const cur = map.get(id);
        cur.wrongCount += Number(i.wrongCount || 1);
        cur.lastWrongAt = Math.max(cur.lastWrongAt, Number(i.lastWrongAt || 0));
      });
      return Array.from(map.values())
        .sort((a, b) => (b.lastWrongAt || 0) - (a.lastWrongAt || 0));
    }

    function normAnswers(arr) {
      if (!Array.isArray(arr)) return [];
      return [...new Set(arr.map(x => String(x).trim().toUpperCase()).filter(Boolean))].sort();
    }

    function sameAnswers(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i += 1) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function clearTimer() {
      if (app.timer) {
        clearTimeout(app.timer);
        app.timer = null;
      }
    }

    function isMulti(q) {
      if (!q) return false;
      return q.type === 'multiple' || (Array.isArray(q.answer) && q.answer.length > 1);
    }

    function pointsByType(type) {
      return type === 'multiple' ? 2 : 1;
    }

    function setStatus(message, isError) {
      el.status.textContent = message || '';
      el.status.style.color = isError ? 'var(--bad)' : 'var(--warn)';
    }

    function bumpWrongById(book, q) {
      const now = Date.now();
      let idx = -1;
      let maxTs = -1;
      for (let i = 0; i < book.length; i += 1) {
        if (String(book[i].id) !== String(q.id)) continue;
        const ts = Number(book[i].lastWrongAt || 0);
        if (ts >= maxTs) {
          idx = i;
          maxTs = ts;
        }
      }
      if (idx >= 0) {
        book[idx].wrongCount = Number(book[idx].wrongCount || 1) + 1;
        book[idx].lastWrongAt = now;
        return;
      }
      book.push({
        id: q.id,
        no: q.no,
        type: q.type,
        question: q.question,
        options: q.options,
        answer: q.answer,
        analysis: q.analysis,
        sourcePage: q.sourcePage,
        source: 'wrong_practice',
        wrongCount: 1,
        lastWrongAt: now
      });
    }

    function applyWrongBookAfterAnswer(q, selected) {
      let book = loadWrongBook();
      if (sameAnswers(selected, q.answer || [])) {
        book = book.filter(i => String(i.id) !== String(q.id));
      } else {
        bumpWrongById(book, q);
      }
      saveWrongBook(book);
    }

    function proceedNextAfterReview() {
      if (!app.questions.length) return;
      if (app.currentIndex >= app.questions.length - 1) {
        showFinalSummary();
        return;
      }
      app.currentIndex += 1;
      render();
    }

    function finalizeCurrentAnswer() {
      if (!app.questions.length) return false;
      const q = app.questions[app.currentIndex];
      if (!q) return false;
      const selected = normAnswers(app.selections[q.id] || []);
      if (!selected.length) return false;
      if (app.locked[q.id]) return true;
      app.locked[q.id] = true;
      applyWrongBookAfterAnswer(q, selected);
      return true;
    }

    function lockAndAutoAdvance() {
      clearTimer();
      const ok = finalizeCurrentAnswer();
      if (!ok) {
        setStatus('请先作答当前题。', true);
        return;
      }
      render();
      const isLast = app.currentIndex >= app.questions.length - 1;
      if (isLast) {
        showFinalSummary();
        return;
      }
      app.timer = setTimeout(() => {
        app.timer = null;
        proceedNextAfterReview();
      }, AUTO_REVIEW_STAY_MS);
    }

    function calcLiveStats() {
      const total = app.questions.length;
      let answered = 0;
      let correct = 0;
      app.questions.forEach(q => {
        if (!app.locked[q.id]) return;
        answered += 1;
        const selected = normAnswers(app.selections[q.id] || []);
        if (sameAnswers(selected, q.answer)) correct += 1;
      });
      const wrong = Math.max(0, answered - correct);
      const percent = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
      return { total, answered, correct, wrong, percent };
    }

    function renderLiveStats() {
      const s = calcLiveStats();
      el.liveStats.textContent = `对 ${s.correct} ｜ 错 ${s.wrong} ｜ 正确率 ${s.percent}% ｜ 已做 ${s.answered}/${s.total}`;
    }

    function showFinalSummary() {
      const s = calcLiveStats();
      setStatus(`本次完成：对 ${s.correct} 题，错 ${s.wrong} 题，正确率 ${s.percent}%。`, false);
    }

    function renderEmpty() {
      el.questionCard.className = 'card empty';
      el.questionCard.innerHTML = `
        <div>暂无错题，返回首页继续练习后再来。</div>
        <div class="empty-actions">
          <a class="action-link btn-primary" href="question-bank.html">去全题库练习</a>
          <a class="action-link btn-plain" href="index.html">返回首页</a>
        </div>
      `;
      el.prevBtn.disabled = true;
      el.nextBtn.disabled = true;
      el.nextBtn.textContent = '下一题';
      setStatus('', false);
      renderLiveStats();
    }

    function renderQuestion() {
      if (!app.questions.length) {
        renderEmpty();
        return;
      }

      const total = app.questions.length;
      const idx = app.currentIndex;
      const q = app.questions[idx];
      const selected = normAnswers(app.selections[q.id] || []);
      const locked = !!app.locked[q.id];
      const show = locked;
      const multi = isMulti(q);
      const inputType = multi ? 'checkbox' : 'radio';
      const isCorrect = show ? sameAnswers(selected, q.answer) : false;

      const optionsHtml = (q.options || []).map(opt => {
        const checked = selected.includes(opt.key) ? 'checked' : '';
        let cls = 'opt';
        if (show) {
          if ((q.answer || []).includes(opt.key)) cls += ' correct';
          if (selected.includes(opt.key) && !(q.answer || []).includes(opt.key)) cls += ' wrong';
        }
        return `
          <label class="${cls}">
            <input type="${inputType}" name="q-${q.id}" value="${opt.key}" ${checked} ${locked ? 'disabled' : ''} />
            <span><strong>${opt.key}.</strong> ${opt.text}</span>
          </label>`;
      }).join('');

      const feedback = show
        ? `<div class="feedback ${isCorrect ? 'ok' : 'bad'}">${isCorrect ? '回答正确' : '回答错误'}（本题 ${pointsByType(q.type)} 分）</div>`
        : '<div class="feedback"></div>';

      const confirmHtml = (multi && !locked)
        ? '<div class="confirm-wrap"><button id="confirmBtn" type="button">提交</button></div>'
        : '';

      el.questionCard.className = `card ${show ? 'show-answer' : ''}`;
      el.questionCard.innerHTML = `
        <div class="meta-row">
          <span class="tag">第 ${idx + 1} / ${total} 题</span>
          <span class="tag">题号 ${q.no || '-'}</span>
          <span class="tag">题型 ${TYPE_LABEL[q.type] || q.type}</span>
          <span class="tag">分值 ${pointsByType(q.type)}</span>
        </div>
        <p class="q">${q.question || '（题干为空）'}</p>
        <div class="opts">${optionsHtml}</div>
        ${feedback}
        <div class="answer">标准答案：${(q.answer || []).join('、') || '无'}</div>
        <div class="analysis">解析：${q.analysis || '无'}</div>
        <div class="tip">${locked ? '已作答' : (multi ? '多选题请选完后点击提交。' : '作答后会立即显示对错并自动下一题。')}</div>
        ${confirmHtml}
      `;

      el.prevBtn.disabled = idx <= 0;
      el.nextBtn.textContent = '下一题';
      el.nextBtn.disabled = (!locked) || (idx >= total - 1);

      bindQuestionEvents(q, multi, locked);
    }

    function bindQuestionEvents(q, multi, locked) {
      if (locked) return;
      const inputs = el.questionCard.querySelectorAll('input[type="radio"], input[type="checkbox"]');
      inputs.forEach(input => {
        input.addEventListener('change', () => {
          let checked = Array.from(el.questionCard.querySelectorAll(`input[name="q-${q.id}"]:checked`)).map(i => i.value);
          if (!multi) checked = checked.slice(0, 1);
          app.selections[q.id] = checked.sort();
          setStatus('', false);
          if (multi) {
            renderQuestion();
            return;
          }
          lockAndAutoAdvance();
        });
      });

      const confirmBtn = document.getElementById('confirmBtn');
      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          const selected = normAnswers(app.selections[q.id] || []);
          if (!selected.length) {
            setStatus('请先选择至少一个答案。', true);
            return;
          }
          lockAndAutoAdvance();
        });
      }
    }

    function handlePrev() {
      clearTimer();
      if (!app.questions.length) return;
      if (app.currentIndex <= 0) return;
      app.currentIndex -= 1;
      setStatus('', false);
      render();
    }

    function handleNextOrSubmit() {
      clearTimer();
      if (!app.questions.length) return;
      const q = app.questions[app.currentIndex];
      const locked = !!app.locked[q.id];
      if (!locked) {
        if (isMulti(q)) {
          setStatus('多选题请点击“提交”后再下一题。', true);
        } else {
          setStatus('请先作答当前题。', true);
        }
        return;
      }

      if (app.currentIndex >= app.questions.length - 1) {
        showFinalSummary();
        return;
      }

      app.currentIndex += 1;
      setStatus('', false);
      render();
    }

    function init() {
      app.questions = groupWrongQuestions(loadWrongBook());
      app.currentIndex = 0;
      app.selections = {};
      app.locked = {};
      setStatus('', false);
      render();
    }

    function render() {
      renderLiveStats();
      renderQuestion();
    }

    el.prevBtn.addEventListener('click', handlePrev);
    el.nextBtn.addEventListener('click', handleNextOrSubmit);

    init();
  </script>
</body>
</html>
